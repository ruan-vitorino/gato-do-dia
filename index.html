<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gato do dia</title>

  <!-- Vercel Web Analytics (HTML) -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root{
      --bg:#0b1220;
      --card:#111a2e;
      --muted:#aab3c5;
      --text:#eef2ff;
      --btn:#ffffff14;
      --btnb:#ffffff22;
      --ok:#22c55e;
      --err:#ef4444;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(1000px 600px at 20% 0%, #1a2a5a 0%, transparent 60%),
                  radial-gradient(900px 600px at 80% 10%, #2a1a5a 0%, transparent 55%),
                  var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .wrap{width:min(980px, 100%)}
    .top{
      display:flex; gap:16px; align-items:flex-start; justify-content:space-between;
      flex-wrap:wrap; margin-bottom:16px;
    }
    h1{margin:0; font-size:28px}
    .sub{margin-top:6px; color:var(--muted); font-size:14px}
    .card{
      background: linear-gradient(180deg, #121c33 0%, #0f172a 100%);
      border:1px solid #ffffff14;
      border-radius: var(--radius);
      box-shadow: 0 18px 55px rgba(0,0,0,.45);
      overflow:hidden;
    }
    .bar{
      display:flex; gap:10px; padding:14px;
      border-bottom:1px solid #ffffff14;
      align-items:center; justify-content:space-between;
      flex-wrap:wrap; background:#0b1326;
    }
    .left{display:flex; gap:10px; align-items:center; flex-wrap:wrap}

    /* BOTÕES + SELECT (corrige dropdown branco no PC) */
    button, select{
      border:1px solid var(--btnb);
      background:rgba(255,255,255,.10);
      color:var(--text);
      padding:10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight:600;
      outline:none;
    }
    button:hover, select:hover{background:#ffffff1f}
    button:disabled{opacity:.6; cursor:not-allowed}
    select{appearance:auto}
    select option{
      background:#0b1326;
      color:var(--text);
    }

    .badge{
      font-size:12px; color:var(--muted);
      padding:6px 10px; border:1px solid #ffffff14;
      border-radius:999px; background:#ffffff08;
    }
    .status{font-size:12px; color:var(--muted)}
    .status.ok{color:#86efac}
    .status.err{color:#fca5a5}
    .imgWrap{
      position:relative; aspect-ratio: 16 / 10;
      background:#070b14;
    }
    img{width:100%; height:100%; object-fit:cover; display:block}
    .skeleton{
      position:absolute; inset:0;
      background: linear-gradient(90deg, #0b1220 0%, #141f3a 45%, #0b1220 90%);
      background-size: 200% 100%;
      animation: shimmer 1.1s infinite linear;
    }
    @keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
    .footer{
      display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
      padding:14px; color:var(--muted); font-size:12px;
      border-top:1px solid #ffffff14; background:#0b1326;
    }
    a{color:#c7d2fe; text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>🐱 Gato do dia</h1>
        <div class="sub">Imagem aleatória via TheCatAPI.</div>
      </div>
      <div class="badge" id="meta">—</div>
    </div>

    <div class="card">
      <div class="bar">
        <div class="left">
          <button id="btnNew">Novo gato</button>

          <select id="breedSelect" title="Filtrar por raça">
            <option value="">Todas as raças</option>
          </select>

          <button id="btnDownload">Download</button>
          <button id="btnCopy">Copiar link</button>
        </div>
        <div class="status" id="status">Carregando...</div>
      </div>

      <div class="imgWrap">
        <div class="skeleton" id="skel"></div>
        <img id="cat" alt="Imagem de gato" />
      </div>

      <div class="footer">
        <div>Atalhos: <b>N</b> novo gato • <b>D</b> download</div>
        <div><a href="https://thecatapi.com" target="_blank" rel="noreferrer">TheCatAPI</a></div>
      </div>
    </div>
  </div>

  <script>
    const img = document.getElementById("cat");
    const skel = document.getElementById("skel");
    const statusEl = document.getElementById("status");
    const metaEl = document.getElementById("meta");
    const btnNew = document.getElementById("btnNew");
    const btnCopy = document.getElementById("btnCopy");
    const btnDownload = document.getElementById("btnDownload");
    const breedSelect = document.getElementById("breedSelect");

    let lastUrl = "";
    let lastBreed = null;

    function setStatus(text, kind = "") {
      statusEl.className = "status " + kind;
      statusEl.textContent = text;
    }

    async function loadBreeds() {
      try {
        const res = await fetch("/api/breeds", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const breeds = await res.json();

        for (const b of breeds) {
          const opt = document.createElement("option");
          opt.value = b.id;
          opt.textContent = b.origin ? `${b.name} (${b.origin})` : b.name;
          breedSelect.appendChild(opt);
        }
      } catch (e) {
        console.warn("Breeds fail:", e);
      }
    }

    async function loadCat() {
      const breedId = breedSelect.value;
      setStatus("Buscando...", "");
      btnNew.disabled = true;
      btnCopy.disabled = true;
      btnDownload.disabled = true;
      skel.style.display = "block";

      try {
        const url = "/api/cat" + (breedId ? `?breed_id=${encodeURIComponent(breedId)}` : "");
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();
        lastUrl = data.url;
        lastBreed = data.breed;

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = data.url + (data.url.includes("?") ? "&" : "?") + "t=" + Date.now();
        });

        const id = data.id || "—";
        const w = data.width || "—";
        const h = data.height || "—";
        const breedText = lastBreed?.name ? ` • ${lastBreed.name}` : "";
        metaEl.textContent = `id: ${id} • ${w}×${h}${breedText}`;

        setStatus("Pronto.", "ok");
        btnCopy.disabled = false;
        btnDownload.disabled = false;
      } catch (e) {
        setStatus("Erro ao carregar: " + e.message, "err");
      } finally {
        skel.style.display = "none";
        btnNew.disabled = false;
      }
    }

    async function copyLink() {
      if (!lastUrl) return;
      try {
        await navigator.clipboard.writeText(lastUrl);
        setStatus("Link copiado!", "ok");
        setTimeout(() => setStatus("Pronto.", "ok"), 1200);
      } catch {
        setStatus("Não consegui copiar (bloqueio do navegador).", "err");
      }
    }

    // DOWNLOAD via backend (evita erro CORS/Failed to fetch)
    function downloadImage() {
      if (!lastUrl) return;
      const u = "/api/download?url=" + encodeURIComponent(lastUrl);
      window.open(u, "_blank");
    }

    btnNew.addEventListener("click", loadCat);
    btnCopy.addEventListener("click", copyLink);
    btnDownload.addEventListener("click", downloadImage);
    breedSelect.addEventListener("change", loadCat);

    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "n") loadCat();
      if (k === "d") downloadImage();
    });

    loadBreeds().finally(loadCat);
  </script>
</body>
</html>
